[project]
name = "skillock"
version = "0.1.3"
description = "Security-first package manager for AI agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
skillock = "skillock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillock"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [".superpowers", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E702", "B007"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
namespace_packages = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "twine>=5.0",
]
