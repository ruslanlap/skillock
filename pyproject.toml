[project]
name = "skillock"
version = "0.1.2"
description = "Security-first package manager for AI agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
skillock = "skillock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillock"]

[dependency-groups]
dev = ["pytest>=8"]
