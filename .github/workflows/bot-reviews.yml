name: Bot Review Handler

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  handle-copilot:
    name: Handle Copilot Review
    if: github.event.review.user.login == 'copilot-swe-agent' || github.event.pull_request.user.login == 'copilot-swe-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Post acknowledgment
        if: github.event.review.state == 'commented' || github.event.review.state == 'changes_requested'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Thanks for the review, @copilot-swe-agent! 🤖\n\nWe appreciate the automated feedback. Human maintainers will review and address actionable items.\n\n---\n*Auto-response to Copilot SWE Agent review*'
            })

  handle-codex:
    name: Handle Codex Review
    if: github.event.review.user.login == 'codex' || github.event.pull_request.user.login == 'codex'
